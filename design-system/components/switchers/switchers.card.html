<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Switchers</title><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{padding:22px;background:var(--surface-page)}.k{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--text-quiet);font-weight:600;margin-block-end:10px}.row{display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin-block-end:20px}.dark{background:var(--navy-800);border-radius:14px;padding:16px 18px;display:flex;gap:18px;align-items:center}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const { CurrencySwitcher, LocaleSwitcher } = window.GaraadDesignSystem_b60642;
function Card(){
const [cur,setCur]=React.useState('GBP');const [loc,setLoc]=React.useState('so');
return <div>
<div className="k">Currency — md (pricing section) and sm (header)</div>
<div className="row"><CurrencySwitcher value={cur} onChange={setCur}/><CurrencySwitcher size="sm" value="USD"/></div>
<div className="k">Language — sets dir as well as words</div>
<div className="row"><LocaleSwitcher value={loc} onChange={setLoc}/><span className="g-caption">Active: {loc.toUpperCase()} · {cur}</span></div>
<div className="k">On navy</div>
<div className="dark"><CurrencySwitcher size="sm" onDark value="EUR"/><LocaleSwitcher onDark value="ar"/></div>
</div>}
ReactDOM.createRoot(document.getElementById('root')).render(<Card/>);
</script></body></html>
