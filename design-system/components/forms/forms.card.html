<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Forms</title><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{padding:22px;background:var(--surface-page)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px 26px;align-items:start}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const { FormField, Chip } = window.GaraadDesignSystem_b60642;
function Card(){
const [v,setV]=React.useState('Ayaan');const [age,setAge]=React.useState('8–10');
return <div className="grid">
<FormField label="Child's first name" name="child" hint="First name is all we need." value={v} onChange={e=>setV(e.target.value)}/>
<FormField label="Email" name="email" type="email" value="hooyo@" onChange={()=>{}} error="We need an email so we can send the lesson link."/>
<FormField label="WhatsApp number" name="wa" type="tel" optional hint="Most families prefer WhatsApp." value="" onChange={()=>{}}/>
<FormField label="Age" name="age">
  <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>{['5–7','8–10','11–13','14–15'].map(a=><Chip key={a} selectable selected={age===a} onChange={()=>setAge(a)} label={a}/>)}</div>
</FormField>
<div style={{gridColumn:'1 / -1'}}><FormField label="Anything the teacher should know?" name="notes" type="textarea" optional maxLength={200} value="" onChange={()=>{}}/></div>
</div>}
ReactDOM.createRoot(document.getElementById('root')).render(<Card/>);
</script></body></html>
