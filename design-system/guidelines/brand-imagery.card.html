<!-- @dsCard group="Brand" viewport="700x200" name="Imagery placeholders" subtitle="Warm navy/gold duotone stands in until real family photography is licensed" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--white);display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:14px}.ph{border-radius:var(--radius-card);height:160px;display:flex;align-items:flex-end;padding:12px;border:1px solid var(--border-hairline)}.cap{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:rgba(246,249,252,.78);background:rgba(6,29,59,.5);border-radius:6px;padding:4px 8px}.hero{background:linear-gradient(135deg,#082A55 0%,#0C3A72 50%,#C4820D 100%)}.port{background:linear-gradient(150deg,#0C3A72 0%,#082A55 55%,#7A5206 100%)}.wash{background:radial-gradient(circle at 15% 15%,rgba(239,165,27,.16),transparent 55%),radial-gradient(circle at 85% 85%,rgba(30,107,214,.16),transparent 55%),var(--paper-100)}</style>
</head><body>
<div class="ph hero"><span class="cap">Placeholder — child at a laptop, warm home light</span></div>
<div class="ph port"><span class="cap">Placeholder — teacher portrait 4:5</span></div>
<div class="ph wash"><span class="cap" style="color:var(--ink-500);background:rgba(246,249,252,.8)">Hero wash — gold 6% → blue 6%</span></div>
</body></html>
