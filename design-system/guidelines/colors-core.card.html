<!-- @dsCard group="Colors" viewport="700x150" name="Brand core" subtitle="Blue, navy, paper, ink — the locked brand hexes" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--white)}.row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.sw{border-radius:12px;padding:12px;height:106px;display:flex;flex-direction:column;justify-content:flex-end;border:1px solid var(--border-hairline)}.n{font-size:13px;font-weight:700}.h{font-size:12px;opacity:.8;font-variant-numeric:tabular-nums}</style>
</head><body><div class="row">
<div class="sw" style="background:var(--blue-primary);color:#fff"><span class="n">blue-primary</span><span class="h">#1E6BD6</span></div>
<div class="sw" style="background:var(--navy-deep);color:#fff"><span class="n">navy-deep</span><span class="h">#082A55</span></div>
<div class="sw" style="background:var(--paper);color:var(--ink)"><span class="n">paper</span><span class="h">#F6F9FC</span></div>
<div class="sw" style="background:var(--ink);color:#fff"><span class="n">ink</span><span class="h">#0A1B2E</span></div>
</div></body></html>
