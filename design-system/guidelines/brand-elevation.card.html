<!-- @dsCard group="Brand" viewport="700x170" name="Elevation" subtitle="One resting shadow; hover adds a 2px lift, never a second shadow style" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:26px 22px;background:var(--paper-100);display:flex;gap:20px}.c{flex:1;background:var(--white);border:1px solid var(--border-hairline);border-radius:var(--radius-card);padding:16px;font-size:12.5px;color:var(--ink-500);line-height:1.5}.n{font-size:13px;font-weight:700;color:var(--text-heading);margin-block-end:4px}</style>
</head><body>
<div class="c" style="box-shadow:var(--shadow-rest)"><div class="n">Resting</div>0 1px 2px rgba(8,42,85,.06), 0 8px 24px rgba(8,42,85,.08)</div>
<div class="c" style="box-shadow:var(--shadow-hover);transform:translateY(-2px)"><div class="n">Hover — lift 2px</div>Same family, slightly deeper. Cursor lift does the talking.</div>
<div class="c" style="box-shadow:var(--shadow-modal)"><div class="n">Modal</div>0 24px 64px rgba(6,29,59,.28) over a 56% navy scrim</div>
</body></html>
