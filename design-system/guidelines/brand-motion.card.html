<!-- @dsCard group="Brand" viewport="700x160" name="Motion" subtitle="150–250ms ease-out cubic-bezier(.2,.8,.2,1); reveals rise 12px, stagger 60ms" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:22px;background:var(--white)}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.c{border:1px solid var(--border-hairline);border-radius:12px;padding:12px;background:var(--paper-100);animation:g-reveal 250ms var(--ease-out) both}.c:nth-child(2){animation-delay:60ms}.c:nth-child(3){animation-delay:120ms}.c:nth-child(4){animation-delay:180ms}.n{font-size:12px;font-weight:700;color:var(--text-heading)}.v{font-size:11.5px;color:var(--text-muted);margin-block-start:4px;line-height:1.45}.f{margin-block-start:14px;font-size:12px;color:var(--text-muted)}</style>
</head><body>
<div class="g">
<div class="c"><div class="n">150ms</div><div class="v">price cross-fade</div></div>
<div class="c"><div class="n">180ms</div><div class="v">hover, press</div></div>
<div class="c"><div class="n">200ms</div><div class="v">header compact, accordion</div></div>
<div class="c"><div class="n">250ms</div><div class="v">scroll reveal, modal in</div></div>
</div>
<div class="f">Reveals fire once, never on the hero. Under <code>prefers-reduced-motion: reduce</code> transforms and loops stop; opacity only.</div>
</body></html>
