<!-- @dsCard group="Spacing" viewport="700x190" name="Section rhythm" subtitle="96px desktop / 64px mobile between sections; 1200px container, 24px gutters" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;background:var(--paper-200)}.pg{background:var(--paper-100);border:1px solid var(--border-hairline);border-radius:10px;overflow:hidden}.sec{padding:22px 26px;position:relative}.alt{background:var(--white)}.h{height:14px;width:180px;background:var(--navy-800);border-radius:3px;opacity:.85}.l{height:8px;width:280px;background:var(--line-100);border-radius:3px;margin-block-start:8px}.tag{position:absolute;inset-inline-end:12px;inset-block-start:10px;font-size:10.5px;font-weight:700;color:var(--text-quiet);letter-spacing:.05em}.gut{position:absolute;inset-block:0;width:26px;background:rgba(30,107,214,.08)}</style>
</head><body><div class="pg">
<div class="sec"><span class="gut" style="inset-inline-start:0"></span><span class="gut" style="inset-inline-end:0"></span><span class="tag">paper · section-y 96</span><div class="h"></div><div class="l"></div></div>
<div class="sec alt"><span class="tag">white</span><div class="h"></div><div class="l"></div></div>
<div class="sec" style="background:var(--navy-800)"><span class="tag" style="color:#7E9AC0">navy — one or two per page, maximum</span><div class="h" style="background:var(--paper-100)"></div><div class="l" style="background:rgba(246,249,252,.25)"></div></div>
</div></body></html>
