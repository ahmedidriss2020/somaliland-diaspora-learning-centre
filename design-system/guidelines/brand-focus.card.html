<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:24px 22px;background:var(--white);display:flex;gap:26px;align-items:center}.btn{background:var(--blue-primary);color:#fff;border:none;border-radius:var(--radius-button);padding:14px 22px;font:600 16px var(--font-core);min-height:48px}.ring{outline:3px solid var(--focus-ring);outline-offset:3px}.t{position:relative;width:48px;height:48px;border-radius:12px;background:var(--paper-200);border:1px dashed var(--blue-200);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--ink-500)}.cap{font-size:12.5px;color:var(--text-muted);line-height:1.5;max-width:230px}</style>
</head><body>
<button class="btn ring">Focus-visible</button>
<div class="t">48</div>
<div class="cap">The rotating CTA ring pauses on focus so the gold ring is unambiguous. Focus is never removed, only replaced.</div>
</body></html>
