<!-- @dsCard group="Colors" viewport="700x140" name="Neutrals and surfaces" subtitle="Page, card, sunken, lines — alternate paper and white for rhythm" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--white)}.row{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.sw{border-radius:10px;height:96px;border:1px solid var(--border-hairline);display:flex;align-items:flex-end;padding:10px}.n{font-size:11.5px;font-weight:700;color:var(--ink-700)}</style>
</head><body><div class="row">
<div class="sw" style="background:var(--white)"><span class="n">white</span></div>
<div class="sw" style="background:var(--paper-50)"><span class="n">paper-50</span></div>
<div class="sw" style="background:var(--paper-100)"><span class="n">paper-100</span></div>
<div class="sw" style="background:var(--paper-200)"><span class="n">paper-200</span></div>
<div class="sw" style="background:var(--line-100)"><span class="n">line-100</span></div>
<div class="sw" style="background:var(--navy-900)"><span class="n" style="color:var(--paper-100)">navy-900</span></div>
</div></body></html>
