<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--white);display:grid;grid-template-columns:1fr 1fr;gap:14px}.p{padding:14px 16px;border-radius:12px}.l{font-size:11px;text-transform:uppercase;letter-spacing:.07em;font-weight:700;opacity:.6}.t{font-size:15px;line-height:1.5;margin-block-start:4px}</style>
</head><body>
<div class="p" style="background:var(--paper-100)">
<div class="l" style="color:var(--text-muted)">On paper</div>
<div class="t" style="color:var(--text-body)">text-body · a verified teacher, twice a week</div>
<div class="t" style="color:var(--text-muted)">text-muted · 1 full hour · no card needed to book</div>
<div class="t" style="color:var(--text-quiet)">text-quiet · captions and legal small print</div>
</div>
<div class="p" style="background:var(--navy-deep)">
<div class="l" style="color:var(--text-on-dark-muted)">On navy</div>
<div class="t" style="color:var(--text-on-dark)">text-on-dark · parents are buying safety first</div>
<div class="t" style="color:var(--text-on-dark-muted)">text-on-dark-muted · published, not promised</div>
<div class="t" style="color:var(--gold-star)">gold-star · used for emphasis, never for body copy</div>
</div>
</body></html>
