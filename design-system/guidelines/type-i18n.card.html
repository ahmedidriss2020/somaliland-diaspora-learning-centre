<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--white);display:grid;grid-template-columns:1fr 1fr;gap:18px}.m{font-size:11px;color:var(--text-quiet);font-weight:600;letter-spacing:.05em;margin-block-end:6px}.b{padding:14px;border-radius:12px;background:var(--paper-100);border:1px solid var(--border-hairline)}</style>
</head><body>
<div class="b" dir="rtl" lang="ar">
<div class="m" style="text-align:start">Arabic · font-arabic · 1.8</div>
<div style="font-family:var(--font-arabic);font-size:22px;font-weight:700;color:var(--text-heading)">الدرس الأول مجاني</div>
<p style="font-family:var(--font-arabic);font-size:var(--text-arabic-base);line-height:var(--lh-arabic-body);color:var(--ink-700);margin-block-start:6px">ساعة كاملة مع معلم موثّق. لا حاجة لبطاقة الدفع للحجز.</p>
</div>
<div class="b">
<div class="m">Somali · font-core · expansion test</div>
<div style="font-size:20px;font-weight:700;color:var(--text-heading)">Casharkii ugu horreeya waa bilaash</div>
<p style="font-size:16px;line-height:1.6;color:var(--ink-700);margin-block-start:6px">Saacad buuxda oo macallin la xaqiijiyay. Kaadhka lacag bixinta looma baahna.</p>
</div>
</body></html>
